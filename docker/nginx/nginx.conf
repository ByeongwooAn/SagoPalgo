# Nginx 전체 프로세스와 공통 HTTP 동작을 정의하는 루트 설정입니다.
# 실제 API 라우팅은 /etc/nginx/conf.d/default.conf로 생성되는 템플릿 설정이 담당합니다.

worker_processes auto;

events {
    # 로컬 개발과 소규모 운영 초기 단계에 충분한 동시 연결 수입니다.
    worker_connections 1024;
}

http {
    # MIME 타입과 기본 응답 타입을 설정합니다.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Docker 로그 수집이 쉽도록 access/error 로그를 표준 출력으로 보냅니다.
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # 정적 파일 전송 최적화와 keep-alive를 켭니다.
    sendfile on;
    keepalive_timeout 65;

    # Flutter 앱과 API가 JSON을 주고받을 때 필요한 기본 압축 설정입니다.
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;

    # 템플릿에서 생성된 서버 블록을 불러옵니다.
    include /etc/nginx/conf.d/*.conf;
}
