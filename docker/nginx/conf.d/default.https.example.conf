# 운영 HTTPS용 Nginx 예시 설정입니다.
# 실제 운영 서버에서는 아래 server_name, 인증서 경로를 실제 값으로 바꾸고 이 파일을 conf.d/default.conf로 적용합니다.

server {
    listen 80;
    server_name api.sagopalgo.app;

    # 운영에서는 HTTP 요청을 HTTPS로 강제 전환합니다.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.sagopalgo.app;

    # Cloudflare Origin Certificate, Let's Encrypt, 또는 사내 인증서 경로로 교체합니다.
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # 구버전 TLS를 끄고 현대 브라우저/앱 기준 프로토콜만 허용합니다.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 모바일 앱 API 요청에 충분한 본문 크기 제한입니다.
    client_max_body_size 10m;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://spring-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
