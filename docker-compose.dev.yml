name: sagopalgo-dev

services:
  # 개발 환경에서는 Python 분석 API 계약과 상태를 호스트에서 직접 확인할 수 있게 합니다.
  ai-server:
    container_name: sagopalgo-ai-server-dev
    ports:
      - "${SAGOPALGO_AI_PORT}:8000"

  # 개발 환경에서는 로컬 DB 도구로 접속할 수 있도록 MySQL 포트를 호스트에 공개합니다.
  mysql:
    container_name: sagopalgo-mysql-dev
    ports:
      - "${SAGOPALGO_MYSQL_PORT}:3306"

  # 개발 환경에서는 Flutter Windows, Postman, 브라우저에서 API를 바로 확인할 수 있도록 8080을 공개합니다.
  spring-api:
    container_name: sagopalgo-spring-api-dev
    ports:
      - "${SAGOPALGO_API_PORT}:8080"

  # 개발 환경 Nginx는 인증서 없이 HTTP 템플릿을 사용합니다.
  # Flutter Windows에서는 http://localhost:${SAGOPALGO_PROXY_HTTP_PORT} 주소로 접근할 수 있습니다.
  reverse-proxy:
    container_name: sagopalgo-reverse-proxy-dev
    ports:
      - "${SAGOPALGO_PROXY_HTTP_PORT}:80"
    volumes:
      - ./docker/nginx/templates:/etc/nginx/templates:ro
