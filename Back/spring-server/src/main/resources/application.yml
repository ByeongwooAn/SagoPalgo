server:
  # Flutter Windows 프로그램과 로컬 개발 환경에서 접근하기 쉬운 기본 포트입니다.
  port: ${SAGOPALGO_SERVER_PORT}

spring:
  application:
    # 로그와 Actuator 확장 시 앱을 식별하기 위한 서비스 이름입니다.
    name: sagopalgo-api

  datasource:
    # 로컬 MySQL에 Back/database/schema.sql을 먼저 실행했다는 가정의 기본 연결값입니다.
    # 실제 비밀번호와 주소는 환경 변수로 덮어쓸 수 있게 구성했습니다.
    url: ${SAGOPALGO_DB_URL}
    username: ${SAGOPALGO_DB_USERNAME}
    password: ${SAGOPALGO_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jackson:
    # API 응답의 날짜/시간을 사람이 읽을 수 있는 ISO 문자열로 내려주기 위한 설정입니다.
    serialization:
      write-dates-as-timestamps: false
    # 성공 응답의 error=null, 실패 응답의 data=null처럼 의미 없는 null 필드는 JSON에서 제외합니다.
    default-property-inclusion: non_null

mybatis:
  configuration:
    # DB 컬럼명(user_id)을 Java 필드명(userId)으로 자동 매핑하기 위한 설정입니다.
    map-underscore-to-camel-case: true

sagopalgo:
  alerts:
    # Ubuntu 백엔드가 보유 종목을 재분석하고 Windows 앱용 알림을 저장합니다.
    analysis-enabled: ${SAGOPALGO_ALERT_ANALYSIS_ENABLED:false}
    cron: ${SAGOPALGO_ALERT_ANALYSIS_CRON:0 0/15 * * * *}
    zone: ${SAGOPALGO_ALERT_ANALYSIS_ZONE:Asia/Seoul}
    cooldown-minutes: ${SAGOPALGO_ALERT_COOLDOWN_MINUTES:60}
    price-events-enabled: ${SAGOPALGO_ALERT_PRICE_EVENTS_ENABLED:true}
    volatility-threshold-rate: ${SAGOPALGO_ALERT_VOLATILITY_THRESHOLD_RATE:5.0}
    research-events-enabled: ${SAGOPALGO_ALERT_RESEARCH_EVENTS_ENABLED:true}
    news-max-age-hours: ${SAGOPALGO_ALERT_NEWS_MAX_AGE_HOURS:24}
    disclosure-max-age-days: ${SAGOPALGO_ALERT_DISCLOSURE_MAX_AGE_DAYS:1}
    portfolio-events-enabled: ${SAGOPALGO_ALERT_PORTFOLIO_EVENTS_ENABLED:true}
  ai:
    # Python 분석 서버는 명시적으로 켠 환경에서만 호출하며, 실패하면 규칙 엔진으로 대체합니다.
    enabled: ${SAGOPALGO_AI_ENABLED:false}
    base-url: ${SAGOPALGO_AI_BASE_URL:http://localhost:8000}
    analysis-path: ${SAGOPALGO_AI_ANALYSIS_PATH:/internal/ai/analyze-investment}
    lookback-days: ${SAGOPALGO_AI_LOOKBACK_DAYS:30}
    candle-count: ${SAGOPALGO_AI_CANDLE_COUNT:30}
  personal:
    # 개인용 Windows 프로그램에서는 소셜 로그인 없이 로컬 사용자 1명으로 API를 사용합니다.
    enabled: ${SAGOPALGO_PERSONAL_MODE_ENABLED:true}
    user-id: ${SAGOPALGO_PERSONAL_MODE_USER_ID:1}
    nickname: ${SAGOPALGO_PERSONAL_MODE_NICKNAME:개인 사용자}
    email: ${SAGOPALGO_PERSONAL_MODE_EMAIL:local@sagopalgo.local}
  securities:
    kb:
      # KB증권은 계좌 조회와 추후 주문 기능의 단일 담당으로 둡니다.
      market-data-enabled: ${SAGOPALGO_KB_MARKET_DATA_ENABLED:false}
      account-enabled: ${SAGOPALGO_KB_ACCOUNT_ENABLED:false}
      order-enabled: ${SAGOPALGO_KB_ORDER_ENABLED:false}
      live-order-enabled: ${SAGOPALGO_KB_LIVE_ORDER_ENABLED:false}
      request-ip-address: ${SAGOPALGO_KB_REQUEST_IP_ADDRESS:}
      request-mac-address: ${SAGOPALGO_KB_REQUEST_MAC_ADDRESS:}
      order-ip-address: ${SAGOPALGO_KB_ORDER_IP_ADDRESS:}
      order-mac-address: ${SAGOPALGO_KB_ORDER_MAC_ADDRESS:}
      max-order-amount: ${SAGOPALGO_KB_MAX_ORDER_AMOUNT:1000000}
      max-price-deviation-rate: ${SAGOPALGO_KB_MAX_PRICE_DEVIATION_RATE:5.0}
      # KB증권 공식 API 문서 all_kbstock_excel 기준 기본값입니다. 비밀값이 아니므로 코드 설정에 둡니다.
      base-url: ${SAGOPALGO_KB_BASE_URL:https://developer.kbsec.com:32484}
      grant-type: ${SAGOPALGO_KB_GRANT_TYPE:client_credentials}
      token-path: ${SAGOPALGO_KB_TOKEN_PATH:/oauth2/token}
      accounts-path: ${SAGOPALGO_KB_ACCOUNTS_PATH:}
      holdings-path: ${SAGOPALGO_KB_HOLDINGS_PATH:/api/v1/ssqm1801}
      settlement-balance-path: /api/v1/ssqm2932
      execution-balance-path: /api/v1/ssqm2952
      current-price-path: /api/v1/ivu10140
      candle-path: /api/v1/ivs11560
      accounts-transaction-id: ${SAGOPALGO_KB_ACCOUNTS_TR_ID:}
      holdings-transaction-id: ${SAGOPALGO_KB_HOLDINGS_TR_ID:}
      current-price-transaction-id: ${SAGOPALGO_KB_CURRENT_PRICE_TR_ID:}
      customer-type: ${SAGOPALGO_KB_CUSTOMER_TYPE:P}
      # SSQM1801 보유주식 조회 필수/선택 입력값입니다.
      holdings-inquiry-classification: ${SAGOPALGO_KB_HOLDINGS_INQ_CLSF:0}
      holdings-market-time-code: ${SAGOPALGO_KB_HOLDINGS_MARKET_TIME_CODE:1}
      holdings-stock-code: ${SAGOPALGO_KB_HOLDINGS_STOCK_CODE:}
      # SSQM2932/SSQM2952 잔고 현황 조회 기본 입력값입니다.
      balance-inquiry-classification: "1"
      balance-exchange-market-price-code: A
      # IVU10140 현재가 조회 기본 입력값입니다. 0=통합, 1=KRX, 2=NXT.
      current-price-exchange-classification: "0"
      app-key: ${SAGOPALGO_KB_APP_KEY:}
      app-secret: ${SAGOPALGO_KB_APP_SECRET:}
      account-number: ${SAGOPALGO_KB_ACCOUNT_NUMBER:}
      account-product-code: ${SAGOPALGO_KB_ACCOUNT_PRODUCT_CODE:}
      account-number-field: ${SAGOPALGO_KB_ACCOUNT_NUMBER_FIELD:accountNumber}
      account-product-code-field: ${SAGOPALGO_KB_ACCOUNT_PRODUCT_CODE_FIELD:accountProductCode}
    toss:
      # Toss 증권은 분석용 시세/종목 정보 보조 소스로만 사용합니다.
      market-data-enabled: ${SAGOPALGO_TOSS_MARKET_DATA_ENABLED:false}
      base-url: ${SAGOPALGO_TOSS_BASE_URL:https://openapi.tossinvest.com}
      grant-type: ${SAGOPALGO_TOSS_GRANT_TYPE:client_credentials}
      token-path: ${SAGOPALGO_TOSS_TOKEN_PATH:/oauth2/token}
      current-price-path: ${SAGOPALGO_TOSS_CURRENT_PRICE_PATH:/api/v1/prices}
      stock-info-path: ${SAGOPALGO_TOSS_STOCK_INFO_PATH:/api/v1/stocks}
      candle-path: ${SAGOPALGO_TOSS_CANDLE_PATH:/api/v1/candles}
      app-key: ${SAGOPALGO_TOSS_APP_KEY:}
      app-secret: ${SAGOPALGO_TOSS_APP_SECRET:}
  market:
    kis:
      # 한국투자증권 Open API 현재가 조회 사용 여부입니다. 키를 설정한 환경에서만 true로 켭니다.
      enabled: ${SAGOPALGO_KIS_ENABLED:false}
      # 실전 REST: https://openapi.koreainvestment.com:9443, 모의 REST: https://openapivts.koreainvestment.com:29443
      base-url: ${SAGOPALGO_KIS_BASE_URL:https://openapi.koreainvestment.com:9443}
      # 한국투자증권 개발자센터에서 발급받은 App Key/Secret입니다.
      app-key: ${SAGOPALGO_KIS_APP_KEY:}
      app-secret: ${SAGOPALGO_KIS_APP_SECRET:}
      # OAuth2 client_credentials 토큰 발급 설정입니다.
      grant-type: ${SAGOPALGO_KIS_GRANT_TYPE:client_credentials}
      token-path: ${SAGOPALGO_KIS_TOKEN_PATH:/oauth2/tokenP}
      # 국내주식 현재가 시세 API 설정입니다.
      price-path: ${SAGOPALGO_KIS_PRICE_PATH:/uapi/domestic-stock/v1/quotations/inquire-price}
      transaction-id: ${SAGOPALGO_KIS_PRICE_TR_ID:FHKST01010100}
      # 국내주식 기간별 시세(일/주/월) API 설정입니다.
      candle-path: ${SAGOPALGO_KIS_CANDLE_PATH:/uapi/domestic-stock/v1/quotations/inquire-daily-itemchartprice}
      candle-transaction-id: ${SAGOPALGO_KIS_CANDLE_TR_ID:FHKST03010100}
      customer-type: ${SAGOPALGO_KIS_CUSTOMER_TYPE:P}
  research:
    naver-news:
      enabled: ${SAGOPALGO_NAVER_NEWS_ENABLED:false}
      base-url: ${SAGOPALGO_NAVER_NEWS_BASE_URL:https://naverapihub.apigw.ntruss.com}
      search-path: ${SAGOPALGO_NAVER_NEWS_SEARCH_PATH:/search/v1/news}
      client-id: ${SAGOPALGO_NAVER_NEWS_CLIENT_ID:}
      client-secret: ${SAGOPALGO_NAVER_NEWS_CLIENT_SECRET:}
      display: ${SAGOPALGO_NAVER_NEWS_DISPLAY:10}
    open-dart:
      enabled: ${SAGOPALGO_OPEN_DART_ENABLED:false}
      base-url: ${SAGOPALGO_OPEN_DART_BASE_URL:https://opendart.fss.or.kr}
      disclosure-path: ${SAGOPALGO_OPEN_DART_DISCLOSURE_PATH:/api/list.json}
      corp-code-path: ${SAGOPALGO_OPEN_DART_CORP_CODE_PATH:/api/corpCode.xml}
      api-key: ${SAGOPALGO_OPEN_DART_API_KEY:}
      default-lookback-days: ${SAGOPALGO_OPEN_DART_LOOKBACK_DAYS:30}
      page-count: ${SAGOPALGO_OPEN_DART_PAGE_COUNT:20}
    sync:
      # 관심 종목 자동 동기화는 외부 API 호출을 발생시키므로 명시적으로 켤 때만 실행합니다.
      enabled: ${SAGOPALGO_RESEARCH_SYNC_ENABLED:false}
      # 기본값은 매시 0분과 30분입니다. Spring 6자리 cron 형식을 사용합니다.
      cron: ${SAGOPALGO_RESEARCH_SYNC_CRON:0 0/30 * * * *}
      zone: ${SAGOPALGO_RESEARCH_SYNC_ZONE:Asia/Seoul}
