name: sagopalgo-order-tests
services:
  mysql-order-test:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: order-test-only
      MYSQL_DATABASE: sagopalgo_order_test
    ports:
      - "127.0.0.1:33316:3306"
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./src/test/resources/mysql-order-test-marker.sql:/docker-entrypoint-initdb.d/00-marker.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=order-test-only mysqladmin ping -h localhost -uroot --silent"]
      interval: 2s
      timeout: 5s
      retries: 60
    networks:
      - isolated-order-test
networks:
  isolated-order-test: {}
