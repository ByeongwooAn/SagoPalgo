name: sagopalgo-market-research-tests
services:
  mysql-market-research-test:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: market-research-test-only
      MYSQL_DATABASE: sagopalgo_market_research_test
    ports:
      - "127.0.0.1:33318:3306"
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./src/test/resources/mysql-market-research-marker.sql:/docker-entrypoint-initdb.d/00-marker.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=market-research-test-only mysqladmin ping -h localhost -uroot --silent"]
      interval: 2s
      timeout: 5s
      retries: 60
    networks: [isolated-market-research-test]
networks:
  isolated-market-research-test: {}
