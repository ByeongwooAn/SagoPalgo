name: sagopalgo-order-acceptance
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: acceptance-test-only
      MYSQL_DATABASE: sagopalgo_acceptance_test
      TZ: Asia/Seoul
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./src/test/resources/order-acceptance-marker.sql:/docker-entrypoint-initdb.d/00-marker.sql:ro
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=acceptance-test-only mysqladmin ping -h localhost -uroot --silent"]
      interval: 2s
      timeout: 5s
      retries: 60
    networks: [isolated]
  api:
    image: sagopalgo-order-acceptance-api:local
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mysql: {condition: service_healthy}
    environment:
      SAGOPALGO_SERVER_PORT: 8080
      SAGOPALGO_DB_URL: jdbc:mysql://mysql:3306/sagopalgo_acceptance_test?serverTimezone=UTC&characterEncoding=UTF-8
      SAGOPALGO_DB_USERNAME: root
      SAGOPALGO_DB_PASSWORD: acceptance-test-only
      SAGOPALGO_PERSONAL_MODE_ENABLED: "true"
      SAGOPALGO_PERSONAL_MODE_USER_ID: "1"
      SAGOPALGO_ALERT_ANALYSIS_ENABLED: "false"
      SAGOPALGO_AI_ENABLED: "false"
      SAGOPALGO_RESEARCH_SYNC_ENABLED: "false"
      SAGOPALGO_KB_ACCOUNT_ENABLED: "false"
      SAGOPALGO_KB_MARKET_DATA_ENABLED: "false"
      SAGOPALGO_KB_ORDER_ENABLED: "false"
      SAGOPALGO_KB_LIVE_ORDER_ENABLED: "false"
      SAGOPALGO_KIS_ENABLED: "false"
      SAGOPALGO_TOSS_MARKET_DATA_ENABLED: "false"
      SAGOPALGO_NAVER_NEWS_ENABLED: "false"
      SAGOPALGO_OPEN_DART_ENABLED: "false"
      TZ: Asia/Seoul
    networks: [isolated]
  ingress:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:18082:80"]
    depends_on: [api]
    volumes:
      - ./src/test/resources/order-acceptance-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [isolated, ingress]
networks:
  ingress: {}
  isolated:
    internal: true
