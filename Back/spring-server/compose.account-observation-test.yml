name: sagopalgo-account-observation-tests
services:
  mysql-account-observation-test:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: observation-test-only
      MYSQL_DATABASE: sagopalgo_account_observation_test
    ports:
      - "127.0.0.1:33317:3306"
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./src/test/resources/mysql-account-observation-marker.sql:/docker-entrypoint-initdb.d/00-marker.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=observation-test-only mysqladmin ping -h localhost -uroot --silent"]
      interval: 2s
      timeout: 5s
      retries: 60
    networks:
      - isolated-account-observation-test
networks:
  isolated-account-observation-test: {}
