name: sagopalgo

services:
  # 가격·뉴스·공시를 설명 가능한 가중 점수로 조합하는 로컬 Python 분석 서버입니다.
  ai-server:
    build:
      context: ./AI/ai-server
      dockerfile: Dockerfile
    container_name: sagopalgo-ai-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SAGOPALGO_AI_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - sagopalgo-network

  # 사고팔고의 메인 MySQL 데이터베이스입니다.
  # 컨테이너가 처음 생성될 때 Back/database/schema.sql을 자동 실행해 기본 스키마를 만듭니다.
  # 관리용 직접 포트는 호스트 자신에게만 엽니다.
  mysql:
    image: mysql:8.4
    container_name: sagopalgo-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SAGOPALGO_MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${SAGOPALGO_MYSQL_ROOT_PASSWORD:?Set a non-empty MySQL password in .env}
      MYSQL_DATABASE: ${SAGOPALGO_MYSQL_DATABASE}
      TZ: ${SAGOPALGO_TIMEZONE}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - sagopalgo-mysql-data:/var/lib/mysql
      - ./Back/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - sagopalgo-network

  # Spring Boot API 서버입니다.
  # 설정값은 코드나 이미지에 넣지 않고 Compose가 .env에서 받은 값을 컨테이너 환경 변수로 주입합니다.
  # 직접 API 포트는 호스트 자신에게만 엽니다.
  spring-api:
    build:
      context: ./Back/spring-server
      dockerfile: Dockerfile
    container_name: sagopalgo-spring-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SAGOPALGO_API_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SAGOPALGO_SERVER_PORT: 8080
      SAGOPALGO_DB_URL: jdbc:mysql://mysql:3306/${SAGOPALGO_MYSQL_DATABASE}?serverTimezone=UTC&characterEncoding=UTF-8
      SAGOPALGO_DB_USERNAME: root
      SAGOPALGO_DB_PASSWORD: ${SAGOPALGO_MYSQL_ROOT_PASSWORD:?Set a non-empty MySQL password in .env}
      SAGOPALGO_PERSONAL_MODE_ENABLED: ${SAGOPALGO_PERSONAL_MODE_ENABLED}
      SAGOPALGO_PERSONAL_MODE_USER_ID: ${SAGOPALGO_PERSONAL_MODE_USER_ID}
      SAGOPALGO_PERSONAL_MODE_NICKNAME: ${SAGOPALGO_PERSONAL_MODE_NICKNAME}
      SAGOPALGO_PERSONAL_MODE_EMAIL: ${SAGOPALGO_PERSONAL_MODE_EMAIL}
      SAGOPALGO_AI_ENABLED: ${SAGOPALGO_AI_ENABLED:-true}
      SAGOPALGO_AI_BASE_URL: http://ai-server:8000
      SAGOPALGO_AI_ANALYSIS_PATH: ${SAGOPALGO_AI_ANALYSIS_PATH:-/internal/ai/analyze-investment}
      SAGOPALGO_AI_LOOKBACK_DAYS: ${SAGOPALGO_AI_LOOKBACK_DAYS:-30}
      SAGOPALGO_AI_CANDLE_COUNT: ${SAGOPALGO_AI_CANDLE_COUNT:-30}
      SAGOPALGO_ALERT_ANALYSIS_ENABLED: ${SAGOPALGO_ALERT_ANALYSIS_ENABLED:-false}
      SAGOPALGO_ACCOUNT_OBSERVATION_COLLECTION_ENABLED: ${SAGOPALGO_ACCOUNT_OBSERVATION_COLLECTION_ENABLED:-false}
      SAGOPALGO_ACCOUNT_OBSERVATION_COLLECTION_INTERVAL_SECONDS: ${SAGOPALGO_ACCOUNT_OBSERVATION_COLLECTION_INTERVAL_SECONDS:-900}
      SAGOPALGO_ALERT_ANALYSIS_CRON: ${SAGOPALGO_ALERT_ANALYSIS_CRON:-0 0/15 * * * *}
      SAGOPALGO_ALERT_ANALYSIS_ZONE: ${SAGOPALGO_ALERT_ANALYSIS_ZONE:-Asia/Seoul}
      SAGOPALGO_ALERT_COOLDOWN_MINUTES: ${SAGOPALGO_ALERT_COOLDOWN_MINUTES:-60}
      SAGOPALGO_ALERT_PRICE_EVENTS_ENABLED: ${SAGOPALGO_ALERT_PRICE_EVENTS_ENABLED:-true}
      SAGOPALGO_ALERT_VOLATILITY_THRESHOLD_RATE: ${SAGOPALGO_ALERT_VOLATILITY_THRESHOLD_RATE:-5.0}
      SAGOPALGO_ALERT_RESEARCH_EVENTS_ENABLED: ${SAGOPALGO_ALERT_RESEARCH_EVENTS_ENABLED:-true}
      SAGOPALGO_ALERT_NEWS_MAX_AGE_HOURS: ${SAGOPALGO_ALERT_NEWS_MAX_AGE_HOURS:-24}
      SAGOPALGO_ALERT_DISCLOSURE_MAX_AGE_DAYS: ${SAGOPALGO_ALERT_DISCLOSURE_MAX_AGE_DAYS:-1}
      SAGOPALGO_ALERT_PORTFOLIO_EVENTS_ENABLED: ${SAGOPALGO_ALERT_PORTFOLIO_EVENTS_ENABLED:-true}
      SAGOPALGO_KB_MARKET_DATA_ENABLED: ${SAGOPALGO_KB_MARKET_DATA_ENABLED:-false}
      SAGOPALGO_KB_ACCOUNT_ENABLED: ${SAGOPALGO_KB_ACCOUNT_ENABLED}
      SAGOPALGO_KB_ORDER_ENABLED: ${SAGOPALGO_KB_ORDER_ENABLED}
      SAGOPALGO_KB_LIVE_ORDER_ENABLED: ${SAGOPALGO_KB_LIVE_ORDER_ENABLED:-false}
      SAGOPALGO_KB_REQUEST_IP_ADDRESS: ${SAGOPALGO_KB_REQUEST_IP_ADDRESS:-}
      SAGOPALGO_KB_REQUEST_MAC_ADDRESS: ${SAGOPALGO_KB_REQUEST_MAC_ADDRESS:-}
      SAGOPALGO_KB_ORDER_IP_ADDRESS: ${SAGOPALGO_KB_ORDER_IP_ADDRESS:-}
      SAGOPALGO_KB_ORDER_MAC_ADDRESS: ${SAGOPALGO_KB_ORDER_MAC_ADDRESS:-}
      SAGOPALGO_KB_MAX_ORDER_AMOUNT: ${SAGOPALGO_KB_MAX_ORDER_AMOUNT:-1000000}
      SAGOPALGO_KB_MAX_PRICE_DEVIATION_RATE: ${SAGOPALGO_KB_MAX_PRICE_DEVIATION_RATE:-5.0}
      SAGOPALGO_KB_APP_KEY: ${SAGOPALGO_KB_APP_KEY}
      SAGOPALGO_KB_APP_SECRET: ${SAGOPALGO_KB_APP_SECRET}
      SAGOPALGO_KB_ACCOUNT_NUMBER: ${SAGOPALGO_KB_ACCOUNT_NUMBER}
      SAGOPALGO_TOSS_MARKET_DATA_ENABLED: ${SAGOPALGO_TOSS_MARKET_DATA_ENABLED}
      SAGOPALGO_TOSS_BASE_URL: ${SAGOPALGO_TOSS_BASE_URL:-https://openapi.tossinvest.com}
      SAGOPALGO_TOSS_GRANT_TYPE: ${SAGOPALGO_TOSS_GRANT_TYPE:-client_credentials}
      SAGOPALGO_TOSS_TOKEN_PATH: ${SAGOPALGO_TOSS_TOKEN_PATH:-/oauth2/token}
      SAGOPALGO_TOSS_CURRENT_PRICE_PATH: ${SAGOPALGO_TOSS_CURRENT_PRICE_PATH:-/api/v1/prices}
      SAGOPALGO_TOSS_STOCK_INFO_PATH: ${SAGOPALGO_TOSS_STOCK_INFO_PATH:-/api/v1/stocks}
      SAGOPALGO_TOSS_CANDLE_PATH: ${SAGOPALGO_TOSS_CANDLE_PATH:-/api/v1/candles}
      SAGOPALGO_TOSS_APP_KEY: ${SAGOPALGO_TOSS_APP_KEY}
      SAGOPALGO_TOSS_APP_SECRET: ${SAGOPALGO_TOSS_APP_SECRET}
      SAGOPALGO_KIS_ENABLED: ${SAGOPALGO_KIS_ENABLED}
      SAGOPALGO_MARKET_STREAM_ENABLED: ${SAGOPALGO_MARKET_STREAM_ENABLED:-false}
      SAGOPALGO_MARKET_STREAM_RIGHTS_CONFIRMED: ${SAGOPALGO_MARKET_STREAM_RIGHTS_CONFIRMED:-false}
      SAGOPALGO_MARKET_STREAM_APPROVED_SUBSCRIPTIONS: ${SAGOPALGO_MARKET_STREAM_APPROVED_SUBSCRIPTIONS:-0}
      SAGOPALGO_MARKET_STREAM_SYMBOLS: ${SAGOPALGO_MARKET_STREAM_SYMBOLS:-}
      SAGOPALGO_MARKET_STREAM_STALE_SECONDS: ${SAGOPALGO_MARKET_STREAM_STALE_SECONDS:-15}
      SAGOPALGO_MARKET_AVAILABILITY_ENABLED: ${SAGOPALGO_MARKET_AVAILABILITY_ENABLED:-false}
      SAGOPALGO_RESEARCH_INCREMENTAL_ENABLED: ${SAGOPALGO_RESEARCH_INCREMENTAL_ENABLED:-false}
      SAGOPALGO_RESEARCH_INCREMENTAL_MAX_PAGES: ${SAGOPALGO_RESEARCH_INCREMENTAL_MAX_PAGES:-3}
      SAGOPALGO_RESEARCH_INCREMENTAL_OVERLAP_DAYS: ${SAGOPALGO_RESEARCH_INCREMENTAL_OVERLAP_DAYS:-2}
      SAGOPALGO_KIS_BASE_URL: ${SAGOPALGO_KIS_BASE_URL}
      SAGOPALGO_KIS_APP_KEY: ${SAGOPALGO_KIS_APP_KEY}
      SAGOPALGO_KIS_APP_SECRET: ${SAGOPALGO_KIS_APP_SECRET}
      SAGOPALGO_KIS_GRANT_TYPE: ${SAGOPALGO_KIS_GRANT_TYPE}
      SAGOPALGO_KIS_TOKEN_PATH: ${SAGOPALGO_KIS_TOKEN_PATH}
      SAGOPALGO_KIS_PRICE_PATH: ${SAGOPALGO_KIS_PRICE_PATH}
      SAGOPALGO_KIS_PRICE_TR_ID: ${SAGOPALGO_KIS_PRICE_TR_ID}
      SAGOPALGO_KIS_CANDLE_PATH: ${SAGOPALGO_KIS_CANDLE_PATH:-/uapi/domestic-stock/v1/quotations/inquire-daily-itemchartprice}
      SAGOPALGO_KIS_CANDLE_TR_ID: ${SAGOPALGO_KIS_CANDLE_TR_ID:-FHKST03010100}
      SAGOPALGO_KIS_CUSTOMER_TYPE: ${SAGOPALGO_KIS_CUSTOMER_TYPE}
      SAGOPALGO_NAVER_NEWS_ENABLED: ${SAGOPALGO_NAVER_NEWS_ENABLED:-false}
      SAGOPALGO_NAVER_NEWS_BASE_URL: ${SAGOPALGO_NAVER_NEWS_BASE_URL:-https://naverapihub.apigw.ntruss.com}
      SAGOPALGO_NAVER_NEWS_SEARCH_PATH: ${SAGOPALGO_NAVER_NEWS_SEARCH_PATH:-/search/v1/news}
      SAGOPALGO_NAVER_NEWS_CLIENT_ID: ${SAGOPALGO_NAVER_NEWS_CLIENT_ID:-}
      SAGOPALGO_NAVER_NEWS_CLIENT_SECRET: ${SAGOPALGO_NAVER_NEWS_CLIENT_SECRET:-}
      SAGOPALGO_NAVER_NEWS_DISPLAY: ${SAGOPALGO_NAVER_NEWS_DISPLAY:-10}
      SAGOPALGO_OPEN_DART_ENABLED: ${SAGOPALGO_OPEN_DART_ENABLED:-false}
      SAGOPALGO_OPEN_DART_API_KEY: ${SAGOPALGO_OPEN_DART_API_KEY:-}
      SAGOPALGO_OPEN_DART_LOOKBACK_DAYS: ${SAGOPALGO_OPEN_DART_LOOKBACK_DAYS:-30}
      SAGOPALGO_OPEN_DART_PAGE_COUNT: ${SAGOPALGO_OPEN_DART_PAGE_COUNT:-20}
      SAGOPALGO_RESEARCH_SYNC_ENABLED: ${SAGOPALGO_RESEARCH_SYNC_ENABLED:-false}
      SAGOPALGO_RESEARCH_SYNC_CRON: ${SAGOPALGO_RESEARCH_SYNC_CRON:-0 0/30 * * * *}
      SAGOPALGO_RESEARCH_SYNC_ZONE: ${SAGOPALGO_RESEARCH_SYNC_ZONE:-Asia/Seoul}
      TZ: ${SAGOPALGO_TIMEZONE}
    networks:
      - sagopalgo-network

  # API 앞단의 Nginx 리버스 프록시입니다.
  # Windows 앱이 접근하는 유일한 LAN 포트이며 허용 IP를 Nginx에서 제한합니다.
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: sagopalgo-reverse-proxy
    restart: unless-stopped
    ports:
      - "${SAGOPALGO_PROXY_BIND_ADDRESS:-127.0.0.1}:${SAGOPALGO_PROXY_HTTP_PORT:-8081}:80"
    depends_on:
      - spring-api
    environment:
      SAGOPALGO_NGINX_SERVER_NAME: ${SAGOPALGO_NGINX_SERVER_NAME}
      SAGOPALGO_ALLOWED_CLIENT_IP: ${SAGOPALGO_ALLOWED_CLIENT_IP:-127.0.0.1}
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/templates:/etc/nginx/templates:ro
    networks:
      - sagopalgo-network

networks:
  # 백엔드 관련 컨테이너만 묶는 내부 네트워크입니다.
  sagopalgo-network:
    driver: bridge

volumes:
  # 기존 볼륨 이름을 명시해야 새 빈 DB로 조용히 시작하지 않습니다.
  sagopalgo-mysql-data:
    external: true
    name: ${SAGOPALGO_MYSQL_VOLUME_NAME:?Set SAGOPALGO_MYSQL_VOLUME_NAME to an existing Docker volume}
